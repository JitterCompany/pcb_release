# Reusable KiCad manufacturing release — call this from a project.
#
# In the project (.github/workflows/hardware-release.yml):
#
#   name: hardware release
#   on:
#     workflow_dispatch:
#     push: { tags: ["hw-v*"] }
#   concurrency:
#     group: hardware-release-${{ github.ref }}
#     cancel-in-progress: false        # never cancel a release build midway
#   jobs:
#     release:
#       uses: JitterCompany/pcb_release/.github/workflows/kicad-release.yml@master
#       with:
#         project-dir: hardware/my-board
#
# Builds the fab zip (production/, for the PCBA partner) and the customer set
# (STEP/PDF/renders), and uploads both as workflow artifacts.
name: KiCad release (reusable)

on:
  workflow_call:
    inputs:
      project-dir:
        description: "A single board. The original input, still supported."
        type: string
        default: ""
      project-dirs:
        description: >-
          Several boards, one per line, each optionally followed by skip=a,b and/or
          todo=c,d. Takes precedence over project-dir. Each board is released
          independently and uploads its own artifact pair.
        type: string
        default: ""
      tools:
        description: >-
          Path to the pcb_release submodule in your repo. Leave unset to run this
          repo at tools-ref instead, which needs no submodule.
        type: string
        default: ""
      tools-ref:
        description: >-
          What to fetch when tools: is not set. A branch, a tag, or a full commit SHA
          (short ones are not accepted). The default floats on master, so pass a tag
          or a SHA to pin which version of the checks runs.
        type: string
        default: master
      model-dirs:
        description: >-
          3D path variables this repo defines itself, one NAME=PATH per line, paths
          relative to the repo root. Those variables live in each developer's KiCad
          preferences, so without this nothing tells CI where the repo's own model
          library is and every such model fails to resolve.
        type: string
        default: ""
      image:
        description: >-
          MUST be a `-full` tag: this job exports the STEP and the renders, and
          the plain image has kicad-cli but no stock 3D models, so those
          deliverables would come out with every stock part silently missing.
          Also must be >= the board's KiCad version.
        type: string
        default: ghcr.io/kicad/kicad:10.0-full
      timeout-minutes:
        type: number
        default: 30

jobs:
  # The board list decides the fan-out. One release job per board, each uploading
  # its own artifact pair, so a multi-board repo cuts every board from one tag.
  prepare:
    name: Board list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      # Where the scripts come from: the tools: input if given, otherwise this repo
      # fetched on the fly. No guessing at submodule locations, so a project either
      # says where its submodule is or gets tools-ref.
      - id: tools
        run: |
          T="${{ inputs.tools }}"
          if [ -n "$T" ]; then
            [ -f "$T/pcb-release.sh" ] || {
              echo "::error::tools: '$T' contains no pcb-release.sh"; exit 1; }
          else
            T=.pcb_release
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$T" >> "$GITHUB_OUTPUT"
      - if: steps.tools.outputs.fetch == 'true'
        uses: actions/checkout@v6
        with:
          repository: JitterCompany/pcb_release
          ref: ${{ inputs.tools-ref }}
          path: .pcb_release
      - id: m
        run: |
          if [ -n "${{ inputs.project-dirs }}" ]; then
            cat > /tmp/boards.txt <<'BOARDS'
          ${{ inputs.project-dirs }}
          BOARDS
          else
            # inputs.project-dir, NOT matrix.dir: this job BUILDS the matrix, so there
            # is no matrix context here yet.
            echo "${{ inputs.project-dir }}" > /tmp/boards.txt
          fi
          # Validates the list: a typo in a gate name is a hard error rather than a
          # quietly unenforced gate.
          M=$(python3 "${{ steps.tools.outputs.path }}/scripts/boards.py" --stdin < /tmp/boards.txt)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M" | python3 -m json.tool

  release:
    name: ${{ matrix.name }}
    needs: prepare
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # at release time you want every board's verdict at once
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    container:
      image: ${{ inputs.image }}
      options: --user root      # runner /__w/_temp is root-owned; checkout needs it
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      # Where the scripts come from: the tools: input if given, otherwise this repo
      # fetched on the fly. No guessing at submodule locations, so a project either
      # says where its submodule is or gets tools-ref.
      - id: tools
        run: |
          T="${{ inputs.tools }}"
          if [ -n "$T" ]; then
            [ -f "$T/pcb-release.sh" ] || {
              echo "::error::tools: '$T' contains no pcb-release.sh"; exit 1; }
          else
            T=.pcb_release
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$T" >> "$GITHUB_OUTPUT"
      - if: steps.tools.outputs.fetch == 'true'
        uses: actions/checkout@v6
        with:
          repository: JitterCompany/pcb_release
          ref: ${{ inputs.tools-ref }}
          path: .pcb_release
      # The interactive HTML BOM shells out to InteractiveHtmlBom, which builds a
      # wx.App() even in CLI mode and so needs a display. xvfb gives it a virtual
      # one. Best-effort: the iBOM is an assembly aid, not a gating deliverable,
      # so a non-apt image just means it is skipped with a warning.
      - name: Install xvfb (interactive HTML BOM needs a display)
        continue-on-error: true
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb
      - name: Build release package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          kicad-cli version
          M=""
          while read -r d; do [ -n "$d" ] && M="$M --model-dir=$d"; done <<'DIRS'
          ${{ inputs.model-dirs }}
          DIRS
          "${{ steps.tools.outputs.path }}/pcb-release.sh" "${{ matrix.dir }}" release \
            --skip="${{ matrix.skip }}" --todo="${{ matrix.todo }}" $M
      # upload-artifact ALWAYS zips what it is given, so handing it our .zip would
      # produce a zip containing a zip. Upload the directories instead and put the
      # package name on the artifact: downloading then yields exactly one archive,
      # named the same as the local build's zip.
      - name: Name the packages
        id: pkg
        run: |
          cd "${{ matrix.dir }}"
          echo "production=$(basename "$(ls -t production__*.zip | head -1)" .zip)" >> "$GITHUB_OUTPUT"
          echo "customer=$(basename "$(ls -t customer__*.zip | head -1)" .zip)" >> "$GITHUB_OUTPUT"
      - name: Upload fab package (PCBA partner)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.production }}
          path: ${{ matrix.dir }}/production/
          if-no-files-found: error
      - name: Upload customer set (STEP / PDFs / renders / iBOM)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.customer }}
          path: ${{ matrix.dir }}/customer/
          if-no-files-found: error
      # The build writes release_spec.toml into the project dir, and the drift gate
      # wants it committed. It is not part of either deliverable set, so without this
      # a project that has no submodule checkout could never obtain the file and its
      # drift gate would fail forever with "does not exist yet".
      - name: Upload release_spec.toml (commit this to your repo)
        uses: actions/upload-artifact@v4
        with:
          name: release-spec__${{ matrix.name }}
          path: ${{ matrix.dir }}/release_spec.toml
          if-no-files-found: error
