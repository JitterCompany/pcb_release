# Reusable KiCad validation CI. Call this from a project instead of copying jobs.
#
# In the project (.github/workflows/ci-hardware.yml):
#
#   jobs:
#     hardware:
#       uses: JitterCompany/pcb_release/.github/workflows/kicad-checks.yml@master
#       with:
#         project-dirs: |
#           hardware/my-board
#           hardware/my-board/my-module   skip=pinmap
#           hardware/my-old-board         skip=pinmap todo=drc,3d,drift
#
# The board list is the ONLY thing a project states. EVERY gate is enforced for
# every board unless that board says otherwise, so a new board cannot go silently
# unchecked and a gate cannot be forgotten, only exempted on purpose:
#
#   skip=   structurally impossible here (no MCU means no pin map). Silent.
#   todo=   applies, not green yet. Warned about every run, does not fail.
#
# A single-board project writes one line:
#   with: { project-dir: hardware/my-board }
#
# ONE job runs every board. The gates take seconds per board while the KiCad image
# pull does not, so a job per board would multiply the only expensive part of the
# run by the number of boards to save a few seconds of wall clock. Each board still
# reports its own PASS/FAIL lines, and one failing board never stops the others.
name: KiCad checks (reusable)

on:
  workflow_call:
    inputs:
      project-dir:
        description: "A single board."
        type: string
        default: ""
      project-dirs:
        description: >-
          Several boards, one per line, each optionally followed by skip=a,b and/or
          todo=c,d. Takes precedence over project-dir.
        type: string
        default: ""
      tools:
        description: >-
          Path to the pcb_release submodule in your repo. Leave unset to run this
          repo at tools-ref instead, which needs no submodule.
        type: string
        default: ""
      tools-ref:
        description: >-
          What to fetch when tools: is not set. A branch, a tag, or a full commit SHA
          (short ones are not accepted). The default floats on master, so pass a tag
          or a SHA to pin which version of the checks runs.
        type: string
        default: master
      extra-checks:
        description: >-
          Optional project-specific script, run once per board as
          `<script> <project-dir>` after the standard gates. Absent by default.
        type: string
        default: ""
      model-dirs:
        description: >-
          3D path variables this repo defines itself, one NAME=PATH per line, paths
          relative to the repo root. Those variables live in each developer's KiCad
          preferences, so without this nothing tells CI where the repo's own model
          library is and every such model fails to resolve.
        type: string
        default: ""
      image:
        description: >-
          KiCad image. MUST be >= the board's KiCad version, kicad-cli cannot open
          files newer than itself. Must be a `-full` tag: the plain image ships
          kicad-cli WITHOUT kicad-packages3d, so every stock 3D model silently fails
          to resolve and the STEP and renders come out hollow.
        type: string
        default: ghcr.io/kicad/kicad:10.0-full
      timeout-minutes:
        type: number
        default: 30

jobs:
  hardware:
    name: KiCad checks
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      # KiCad images run as non-root 'kicad'; the runner's /__w/_temp is
      # root-owned, so checkout cannot write its state files -> run as root.
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      # Where the scripts come from: the tools: input if given, otherwise this repo
      # fetched on the fly. No guessing at submodule locations, so a project either
      # says where its submodule is or gets tools-ref.
      - id: tools
        run: |
          T="${{ inputs.tools }}"
          if [ -n "$T" ]; then
            [ -f "$T/pcb-release.sh" ] || {
              echo "::error::tools: '$T' contains no pcb-release.sh"; exit 1; }
          else
            T=.pcb_release
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$T" >> "$GITHUB_OUTPUT"
      - if: steps.tools.outputs.fetch == 'true'
        uses: actions/checkout@v6
        with:
          repository: JitterCompany/pcb_release
          ref: ${{ inputs.tools-ref }}
          path: .pcb_release
      - name: Checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          M=""
          while read -r d; do [ -n "$d" ] && M="$M --model-dir $d"; done <<'DIRS'
          ${{ inputs.model-dirs }}
          DIRS
          cat <<'BOARDS' | "${{ steps.tools.outputs.path }}/pcb-checks.sh" \
              --extra-checks "${{ inputs.extra-checks }}" $M
          ${{ inputs.project-dirs || inputs.project-dir }}
          BOARDS
