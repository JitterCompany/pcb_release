# Reusable KiCad validation CI. Call this from a project instead of copying jobs.
#
# In the project (.github/workflows/ci-hardware.yml):
#
#   jobs:
#     hardware:
#       uses: JitterCompany/pcb_release/.github/workflows/kicad-checks.yml@master
#       with:
#         project-dirs: |
#           hardware/my-board
#           hardware/my-board/my-module   skip=pinmap
#           hardware/my-old-board         skip=pinmap todo=drc,3d,drift
#
# The board list is the ONLY thing a project states. EVERY gate is enforced for
# every board unless that board says otherwise, so a new board cannot go silently
# unchecked and a gate cannot be forgotten, only exempted on purpose:
#
#   skip=   structurally impossible here (no MCU means no pin map). Silent.
#   todo=   applies, not green yet. Warned about every run, does not fail.
#
# A single-board project writes one line:
#   with: { project-dir: hardware/my-board }
#
# ONE job runs every board. The gates take seconds per board while the KiCad image
# pull does not, so a job per board would multiply the only expensive part of the
# run by the number of boards to save a few seconds of wall clock. Each board still
# reports its own PASS/FAIL lines, and one failing board never stops the others.
name: KiCad checks (reusable)

on:
  workflow_call:
    inputs:
      project-dir:
        description: "A single board."
        type: string
        default: ""
      project-dirs:
        description: >-
          Several boards, one per line, each optionally followed by skip=a,b and/or
          todo=c,d. Takes precedence over project-dir.
        type: string
        default: ""
      tools:
        description: "Where the pcb_release submodule is checked out."
        type: string
        default: hardware/tools/pcb_release
      extra-checks:
        description: >-
          Optional project-specific script, run once per board as
          `<script> <project-dir>` after the standard gates. Absent by default.
        type: string
        default: ""
      image:
        description: >-
          KiCad image. MUST be >= the board's KiCad version, kicad-cli cannot open
          files newer than itself. Must be a `-full` tag: the plain image ships
          kicad-cli WITHOUT kicad-packages3d, so every stock 3D model silently fails
          to resolve and the STEP and renders come out hollow.
        type: string
        default: ghcr.io/kicad/kicad:10.0-full
      timeout-minutes:
        type: number
        default: 30

jobs:
  hardware:
    name: KiCad checks
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      # KiCad images run as non-root 'kicad'; the runner's /__w/_temp is
      # root-owned, so checkout cannot write its state files -> run as root.
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - name: Checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat <<'BOARDS' | "${{ inputs.tools }}/pcb-checks.sh" \
              --extra-checks "${{ inputs.extra-checks }}"
          ${{ inputs.project-dirs || inputs.project-dir }}
          BOARDS
